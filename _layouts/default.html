<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<link rel="stylesheet" href="{{ '/assets/css/rouge.css' | relative_url }}">
<style>
  :root { --ink:#24292f; --muted:#57606a; --line:#d0d7de; --code-bg:#f6f8fa; --accent:#0969da; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #ffffff; color: var(--ink);
    font-family: Arial, Helvetica, sans-serif; font-size: 17px; line-height: 1.65;
  }
  header.site {
    border-bottom: 1px solid var(--line); padding: 20px 0; margin-bottom: 36px;
  }
  header.site .wrap { max-width: 740px; margin: 0 auto; padding: 0 20px; }
  header.site a.brand { color: var(--ink); text-decoration: none; font-weight: bold; font-size: 20px; letter-spacing: -0.3px; }
  header.site span.tag { color: var(--muted); font-size: 13px; margin-left: 10px; }
  main { max-width: 740px; margin: 0 auto; padding: 0 20px 80px; }
  h1 { font-size: 30px; line-height: 1.25; letter-spacing: -0.5px; margin: 0 0 24px; }
  h2 { font-size: 22px; margin: 48px 0 12px; padding-top: 8px; border-top: 1px solid var(--line); letter-spacing: -0.2px; }
  h3 { font-size: 18px; margin: 32px 0 8px; color: #1b1f24; }
  p { margin: 0 0 18px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ul, ol { padding-left: 24px; }
  li { margin-bottom: 6px; }
  blockquote { margin: 0 0 18px; padding: 0 16px; border-left: 4px solid var(--line); color: var(--muted); }
  code {
    background: var(--code-bg); padding: 2px 6px; border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.86em;
  }
  pre {
    background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.5;
  }
  pre code { background: none; padding: 0; font-size: inherit; }
  table { border-collapse: collapse; width: 100%; margin: 0 0 20px; font-size: 14px; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--line); padding: 7px 12px; text-align: left; vertical-align: top; }
  th { background: var(--code-bg); }
  td code { word-break: break-all; }
  hr { border: none; border-top: 1px solid var(--line); margin: 40px 0; }
  img { max-width: 100%; }
  footer.site { max-width: 740px; margin: 0 auto; padding: 24px 20px 60px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header class="site"><div class="wrap">
  <a class="brand" href="{{ '/' | relative_url }}">pwnioeer</a>
  <span class="tag">security research &amp; malware teardowns</span>
</div></header>
<main>
{% if page.title %}<h1>{{ page.title }}</h1>{% endif %}
{{ content }}
</main>
<footer class="site">pwnioeer · written because the pipeline failed to notice</footer>
</body>
</html>
